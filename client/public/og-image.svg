<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="180" fill="#3b82f6" opacity="0.08" />
  <circle cx="150" cy="510" r="140" fill="#8b5cf6" opacity="0.08" />

  <!-- Accent bar -->
  <rect x="80" y="260" width="6" height="110" rx="3" fill="url(#accent)" />

  <!-- Logo / brand -->
  <text x="80" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="white" letter-spacing="-1">AWE-OS</text>
  <rect x="80" y="218" width="200" height="4" rx="2" fill="url(#accent)" />

  <!-- Main headline -->
  <text x="96" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Free AI-Powered Tools</text>
  <text x="96" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">for Everyone</text>

  <!-- Subheadline -->
  <text x="96" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">100+ free tools — PDF, Calculators, Converters &amp; AI</text>

  <!-- Feature pills -->
  <rect x="96" y="470" width="160" height="44" rx="22" fill="#3b82f6" opacity="0.25" />
  <text x="176" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#93c5fd" text-anchor="middle">📄 PDF Tools</text>

  <rect x="270" y="470" width="180" height="44" rx="22" fill="#22c55e" opacity="0.20" />
  <text x="360" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#86efac" text-anchor="middle">🧮 Calculators</text>

  <rect x="464" y="470" width="160" height="44" rx="22" fill="#8b5cf6" opacity="0.25" />
  <text x="544" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#c4b5fd" text-anchor="middle">🤖 AI Tools</text>

  <!-- Domain -->
  <text x="1120" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" text-anchor="end">awe-os.com</text>
</svg>
